groups:
  - name: ml_alerts
    rules:
      - alert: ModelNotLoaded
        expr: ml_model_loaded == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Model is not loaded"}
      - alert: PredictionLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(ml_prediction_duration_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Prediction p95 latency exceeds 100ms"}
      - alert: HighPredictionErrorRate
        expr: sum(rate(ml_prediction_errors_total[5m])) / clamp_min(sum(rate(ml_predictions_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Prediction error rate exceeds 5%"}
      - alert: ModelStale
        expr: time() - ml_model_last_reload_timestamp > 604800
        for: 1h
        labels: {severity: info}
        annotations: {summary: "Model has not been reloaded for seven days"}
