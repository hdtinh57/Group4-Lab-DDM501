name: Lab 3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r Lab02.1/requirements-dev.txt
      - run: ruff check app tests
        working-directory: Lab02.1
      - run: python -m pytest tests
        working-directory: Lab02.1
